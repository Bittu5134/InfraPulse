{% extends "base.html" %}

{% block title %}Page Not Found - InfraPulse{% endblock %}

{% block content %}
<div class="min-h-[50vh] flex items-center justify-center">
    <div class="max-w-md w-full text-center space-y-5 p-8 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
        <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        </div>
        <div class="space-y-1">
            <h1 class="text-3xl font-bold font-mono text-slate-900 dark:text-white">404</h1>
            <h2 class="text-base font-semibold text-slate-800 dark:text-slate-200">Page Not Found</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">The requested URL was not found on this server.</p>
        </div>
        <div>
            <a href="/" class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm transition-colors">
                <i class="fa-solid fa-house text-xs"></i>
                <span>Return to Overview</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
