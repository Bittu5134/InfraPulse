version: '3.8'

services:
  infrapulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrapulse-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./infrapulse.db:/app/infrapulse.db
      - ./app/static/uploads:/app/app/static/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/queue"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
